[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vertexai-proxy"
version = "0.1.0"
description = "Local OpenAI-compatible proxy for Vertex AI Gemini and Claude"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "litellm>=1.75,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
vertexai-proxy = "vertexai_proxy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vertexai_proxy"]
